<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوغُس - صفحة اختبار مؤقتة</title>
  <style>
    body { font-family: Tahoma, Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    fieldset { margin-bottom: 24px; padding: 16px; border-radius: 8px; }
    label { display: block; margin-top: 8px; font-size: 14px; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 10px 16px; cursor: pointer; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
    #token-status { background: #eef6ff; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h2>صفحة اختبار مؤقتة (ستُحذَف لاحقًا)</h2>

  <div id="token-status">لا يوجد رمز جلسة محفوظ حاليًا.</div>

  <fieldset>
    <legend>1) تحقق من تكرار الهاتف</legend>
    <label>رقم الهاتف
      <input id="check-phone" placeholder="مثال: 99998888" />
    </label>
    <button onclick="checkPhone()">تحقق</button>
  </fieldset>

  <fieldset>
    <legend>2) تسجيل طفل جديد</legend>
    <label>الاسم الثلاثي
      <input id="reg-name" placeholder="مثال: مريم جورج فرج" />
    </label>
    <label>رقم الهاتف
      <input id="reg-phone" placeholder="مثال: 99998888" />
    </label>
    <label>الرمز السري (4 أرقام)
      <input id="reg-pin" placeholder="مثال: 1234" maxlength="4" />
    </label>
    <label>معرّف الفصل (Class ID)
      <input id="reg-class" placeholder="مثال: abc123XYZ" />
    </label>
    <button onclick="registerChild()">تسجيل</button>
  </fieldset>

  <fieldset>
    <legend>3) تسجيل الدخول</legend>
    <label>رقم الهاتف
      <input id="login-phone" placeholder="مثال: 99998888" />
    </label>
    <label>الرمز السري
      <input id="login-pin" placeholder="مثال: 1234" maxlength="4" />
    </label>
    <button onclick="loginChild()">دخول</button>
  </fieldset>

  <fieldset>
    <legend>4) تغيير الرمز السري (يستخدم الرمز المحفوظ تلقائيًا أعلاه)</legend>
    <label>الرمز الحالي
      <input id="change-current" placeholder="مثال: 1234" maxlength="4" />
    </label>
    <label>الرمز الجديد
      <input id="change-new" placeholder="مثال: 5678" maxlength="4" />
    </label>
    <button onclick="changePin()">تغيير</button>
  </fieldset>

  <h3>النتيجة:</h3>
  <pre id="result">-- ستظهر النتيجة هنا --</pre>

  <script>
    const resultEl = document.getElementById('result');
    const tokenStatusEl = document.getElementById('token-status');
    let savedToken = null;

    function updateTokenStatus() {
      tokenStatusEl.textContent = savedToken
        ? '✅ يوجد رمز جلسة محفوظ حاليًا (من آخر تسجيل/دخول ناجح).'
        : 'لا يوجد رمز جلسة محفوظ حاليًا.';
    }

    async function callFn(name, body, useAuth = false) {
      resultEl.textContent = '... جارٍ التنفيذ';
      try {
        const headers = { 'Content-Type': 'application/json' };
        if (useAuth) {
          if (!savedToken) {
            resultEl.textContent = 'لا يوجد رمز جلسة محفوظ. سجّل دخولًا أو أنشئ حسابًا أولاً (نموذج 2 أو 3).';
            return;
          }
          headers['Authorization'] = `Bearer ${savedToken}`;
        }

        const res = await fetch(`/.netlify/functions/${name}`, {
          method: 'POST',
          headers,
          body: JSON.stringify(body),
        });
        const data = await res.json();

        // نحفظ الرمز تلقائيًا كلما رجعت الاستجابة به (تسجيل، دخول، أو تغيير رمز)
        if (data.token) {
          savedToken = data.token;
          updateTokenStatus();
        }

        resultEl.textContent = `الحالة: ${res.status}\n` + JSON.stringify(data, null, 2);
      } catch (e) {
        resultEl.textContent = 'خطأ في الاتصال: ' + e.message;
      }
    }

    function checkPhone() {
      callFn('checkChildPhoneAvailability', { phone: document.getElementById('check-phone').value });
    }

    function registerChild() {
      callFn('registerChild', {
        fullName: document.getElementById('reg-name').value,
        phone: document.getElementById('reg-phone').value,
        pin: document.getElementById('reg-pin').value,
        classId: document.getElementById('reg-class').value,
      });
    }

    function loginChild() {
      callFn('loginChild', {
        phone: document.getElementById('login-phone').value,
        pin: document.getElementById('login-pin').value,
      });
    }

    function changePin() {
      callFn(
        'changePin',
        {
          currentPin: document.getElementById('change-current').value,
          newPin: document.getElementById('change-new').value,
        },
        true // يتطلب رمز الجلسة المحفوظ
      );
    }

    updateTokenStatus();
  </script>
</body>
</html>
